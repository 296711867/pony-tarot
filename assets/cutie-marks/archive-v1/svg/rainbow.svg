<svg xmlns="http://www.w3.org/2000/svg" viewBox="11.2 1.3 358.6 788.4">
  <!-- 云宝可爱标志：白云 + 三色闪电，透明背景 -->
  <!-- 闪电三条带（云后穿出，阶梯交错，蓝/黄/红自左向右；蓝条顶端伸入云内被白瓣盖住） -->
  <path fill="#0898D8" d="M 172 225 L 255 225 L 257 426 L 205 380 L 202 482
    L 187 560 L 149 669 L 109 755 L 153 630 L 178 521 L 183 422 Z"/>
  <path fill="#FAE76B" d="M 282 190 L 263 194 L 278 232 L 245 297 L 259 427 L 207 381
    L 205 472 L 189 560 L 159 649 L 113 751 L 166 663 L 207 574 L 227 495 L 232 421
    L 277 463 L 300 493 L 308 348 L 300 275 Z"/>
  <path fill="#E84434" d="M 283 190 L 328 159 L 353 272 L 357 369 L 344 473 L 320 572
    L 280 508 L 252 475 L 237 552 L 210 614 L 158 699 L 109 761 L 173 653 L 209 573
    L 228 499 L 232 423 L 301 494 L 309 421 L 309 338 L 300 265 Z"/>

  <!-- 云朵：五瓣 union，先画描边圈再补白色盖住内側描边，只留外轮廓 -->
  <g stroke="#0898D8" stroke-width="11" fill="#0898D8">
    <ellipse cx="106" cy="240" rx="76" ry="90"/>
    <circle cx="178" cy="232" r="51"/>
    <ellipse cx="156" cy="104" rx="62" ry="68"/>
    <ellipse cx="272" cy="120" rx="52" ry="66"/>
    <circle cx="226" cy="242" r="48"/>
  </g>
  <g fill="#FFFFFF">
    <ellipse cx="106" cy="240" rx="76" ry="90"/>
    <circle cx="178" cy="232" r="51"/>
    <ellipse cx="156" cy="104" rx="62" ry="68"/>
    <ellipse cx="272" cy="120" rx="52" ry="66"/>
    <circle cx="226" cy="242" r="48"/>
  </g>
  <!-- 云底螺旋小卷：外端沿右下瓣轮廓切线接入，向内卷一圈半 -->
  <path fill="none" stroke="#0898D8" stroke-width="11" stroke-linecap="round"
        d="M 254 280 C 260 297 250 311 231 313 C 213 315 200 303 203 289 C 206 277 219 272 228 279 C 235 284 233 295 224 295"/>
</svg>
