          d="M 270 316 C 256 380 304 420 290 480 C 280 524 238 544 230 576 C 224 604 250 618 263 600 C 274 584 260 564 242 574"/>
    <path fill="#F8F3A9" d="M 240 276 L 270 330 L 300 276 Z"/>
    <ellipse fill="#F8F3A9" cx="270" cy="178" rx="88" ry="122"/>
  </g>

  <!-- 左下：蓝气球，黄色细绳 -->
