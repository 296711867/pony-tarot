    <path fill="#7AD2F8" d="M 72 508 L 102 564 L 132 508 Z"/>
    <ellipse fill="#7AD2F8" cx="102" cy="432" rx="88" ry="122"/>
  </g>

  <!-- 右中：蓝气球，黄色细绳 -->
  <g>
    <path fill="none" stroke="#F8F3A9" stroke-width="8.5" stroke-linecap="round"
          d="M 462 518 C 448 602 380 618 350 680 C 326 730 350 776 388 768 C 418 762 416 726 390 726 C 370 726 364 750 382 758"/>
    <path fill="#7AD2F8" d="M 432 494 L 462 550 L 492 494 Z"/>
