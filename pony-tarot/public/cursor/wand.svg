<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" role="img" aria-label="magic wand cursor">
  <!-- 魔法棒光标：星尖指左上 = 点击热区；柄 45° 伸向右下；纯填充剪影，无描边 -->
  <defs>
    <!-- 四角闪火 -->
    <path id="cw-spark" d="M 0 -1 L 0.27 -0.28 L 1 0 L 0.27 0.28 L 0 1 L -0.27 0.28 L -1 0 L -0.27 -0.28 Z"/>
  </defs>

  <!-- 柄：45° 锥形杆，顶端藏入环内，底端没入柄尾球 -->
  <path fill="#7C52B4" d="M 29.11 24.29 L 50.70 51.60 L 48.30 54.00 L 25.29 28.11 Z"/>
  <!-- 柄上高光 -->
  <path fill="#A87FD6" d="M 29.60 25.60 L 49.30 51.10 L 48.20 52.20 L 28.10 26.90 Z"/>
  <!-- 金色环带 ×2 -->
  <path fill="#F2A93B" d="M 34.67 31.42 L 36.65 33.40 L 33.11 36.94 L 31.13 34.96 Z"/>
  <path fill="#F2A93B" d="M 43.90 43.01 L 45.60 44.71 L 42.62 47.69 L 40.92 45.99 Z"/>
  <!-- 柄尾球 -->
  <circle fill="#6E4699" cx="51.8" cy="54.9" r="4.1"/>
  <circle fill="#A87FD6" cx="50.6" cy="53.8" r="1.5"/>

  <!-- 星：尖角指左上(-135°)，光从左上来，右下半上深金 shade -->
  <path fill="#FFD666" d="M 9.45 7.45 L 18.05 10.97 L 25.13 4.97 L 24.43 14.23 L 32.33 19.11
    L 23.31 21.31 L 21.11 30.34 L 16.23 22.44 L 6.97 23.13 L 12.97 16.05 Z"/>
  <path fill="#F2A93B" d="M 9.45 7.45 L 18.05 10.97 L 25.13 4.97 L 24.43 14.23 L 32.33 19.11 L 23.31 21.31 Z"/>

  <!-- 环形接口：金环中孔透空（evenodd） -->
  <path fill="#F2A93B" fill-rule="evenodd" d="M 33.1 27.4 A 4.7 4.7 0 1 0 23.7 27.4 A 4.7 4.7 0 1 0 33.1 27.4 Z
    M 30.9 27.4 A 2.5 2.5 0 1 1 25.9 27.4 A 2.5 2.5 0 1 1 30.9 27.4 Z"/>

  <!-- 闪火与星尘（32px 下需保持互不粘连） -->
  <use href="#cw-spark" fill="#FFD666" transform="translate(46.5,10.5) scale(4.2,6.8)"/>
  <use href="#cw-spark" fill="#FFF3C4" transform="translate(53.5,21.5) scale(2.4,3.9)"/>
  <circle fill="#FFE58A" cx="40.5" cy="6.5" r="1.0"/>
</svg>
